<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { padding: 20px; font-family: Arial, sans-serif; width: 350px; }
    label { display: block; margin: 15px 0 5px; }
    input { width: 100%; padding: 6px; }
    button { margin-top: 20px; width: 100%; padding: 10px; }
  </style>
</head>
<body>
  <h2>Settings</h2>
  
  <label>Capture Interval (seconds)</label>
  <input type="number" id="interval" value="3" min="1" max="30">

  <label>Brightness Mapping (0-9)</label>
  <input type="number" id="divider" value="26" min="1" max="50">

  <button id="saveBtn">Save Settings</button>

  <script src="settings.js"></script>
</body>
</html>
